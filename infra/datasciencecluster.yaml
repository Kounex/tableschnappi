apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    dashboard:
      managementState: Managed
    workbenches:
      managementState: Managed
    aipipelines:
      managementState: Managed
      argoWorkflowsControllers:
        managementState: Managed
    # TrustyAI requires the InferenceService API even for remote models.
    kserve:
      managementState: Managed
    trustyai:
      managementState: Managed
    mlflowoperator:
      managementState: Managed
