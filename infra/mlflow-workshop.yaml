# Development only: one SQLite/PVC-backed server with proxied artifact uploads.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
spec:
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: sqlite:////mlflow/mlflow.db
  # Clients upload through MLflow; only the server needs the artifact PVC.
  serveArtifacts: true
  artifactsDestination: file:///mlflow/artifacts
